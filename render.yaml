# Render.com Blueprint — One-click deploy configuration
# https://render.com/docs/blueprint-spec

databases:
  - name: parking-campus-db
    plan: free
    databaseName: parking_campus
    user: parking_user

services:
  - type: web
    name: college-parking-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parking-campus-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
